<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="@gbvitrano">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Città di Palermo - Codici assegnazione uffici (Protocollo MAIA)">
    <link rel="icon" href="https://raw.githubusercontent.com/SiciliaHub/palermohub/gh-pages/legend/umap/comune_pa.png">
    <title>Città di Palermo - Codici assegnazione uffici (Protocollo MAIA)</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;700&display=swap');
    
    body {
        font-family: 'Titillium Web', sans-serif;
        margin: 20px auto;
        max-width: 800px;
        padding: 0 20px;
        line-height: 1.6;
        background-color: #f5f5f5;
    }

    .logo-container {
        text-align: center;
        margin: 20px 0;
    }

    .logo-container img {
        max-width: 150px;
        height: auto;
    }

    h1 {
        text-align: center;
        color: #003366;
        margin: 20px 0;
    }

    h1 small {
        display: block;
        font-size: 0.7em;
        margin-top: 10px;
        color: #666;
    }

    .search-container {
        margin: 20px 0;
        position: sticky;
        top: 10px;
        z-index: 100;
        background: white;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    #searchInput {
        width: 97%;
        padding: 12px;
        border: 2px solid #003366;
        border-radius: 25px;
        font-size: 16px;
    }

    .area-block {
        background: white;
        margin: 15px 0;
        border-radius: 10px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .area-header {
        padding: 15px;
        background: #ad011b;
        color: white;
        border-radius: 10px 10px 0 0;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .area-header:hover {
        background: #002244;
    }

    .office-list {
        padding: 10px;
        display: grid;
        gap: 10px;
    }

    .office-item {
        display: flex;
        justify-content: space-between;
        padding: 12px;
        background: #f8f9fa;
        border-radius: 8px;
        transition: transform 0.2s;
    }

    .office-item:hover {
        transform: translateX(5px);
        background: #fff9be;
    }

    .code {
        font-weight: bold;
        color: #ff9900;
        margin-left: 15px;
    }

    .no-results {
        text-align: center;
        color: #666;
        padding: 20px;
    }

    @media (max-width: 768px) {
        body {
            max-width: 95%;
        }

        #searchInput {
            width: 92% !important;
            margin: 0 auto;
            display: block;
        }

        .area-header span:nth-child(2) {
            display: none;
        }

        .office-item {
            flex-direction: column;
            gap: 5px;
            text-align: center;
            align-items: center;
            padding: 10px;
        }

        .office-item span:first-child {
            font-size: 0.9em;
            color: #444;
            line-height: 1.4;
        }

        .code {
            margin: 8px 0 0 0;
            font-size: 1em;
            text-align: center;
        }
    }

    @media (max-width: 480px) {
        h1 {
            font-size: 1.5em;
        }
        
        #searchInput {
            font-size: 14px;
            padding: 10px;
        }
    }
</style>
</head>
<body>
    <div class="logo-container">
<a href="https://www.comune.palermo.it/" title="Comune di Palermo" target="_blank"><img src="https://raw.githubusercontent.com/SiciliaHub/palermohub/gh-pages/legend/umap/comune_pa.png" alt="Logo Comune di Palermo"></a>
    </div>
    
    <h1>Codici assegnazione Uffici<br><small>Protocollo MAIA</small></h1>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Cerca l'Area o l'Ufficio per nome..." autofocus>
    </div>

    <div id="areasContainer"></div>

    <script>
        let allData = [];

        async function loadData() {
            try {
                const response = await fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vRIbz6ziYfWDQPW-SPwZqNcsOzpMx7m6VWohZOsEj9uCYMrMerZ-CjFQdZ-y6bU8M6RshFrsLDjd_l6/pub?gid=0&single=true&output=csv');
                const csv = await response.text();
                allData = processData(csv);
                renderBlocks(allData);
                initSearch();
            } catch (error) {
                console.error('Errore:', error);
                showError();
            }
        }

        function processData(csv) {
            const lines = csv.split('\n').filter(line => line.trim());
            const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
            
            return lines.slice(1).reduce((acc, line) => {
                const values = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                const entry = {
                    area: values[0].replace(/^"|"$/g, ''),
                    ufficio: values[1].replace(/^"|"$/g, ''),
                    codice: values[2].replace(/^"|"$/g, '')
                };
                
                if(!acc[entry.area]) acc[entry.area] = [];
                acc[entry.area].push(entry);
                return acc;
            }, {});
        }

        function renderBlocks(data) {
            const container = document.getElementById('areasContainer');
            container.innerHTML = '';
            
            Object.entries(data).forEach(([area, uffici]) => {
                const block = document.createElement('div');
                block.className = 'area-block';
                block.innerHTML = `
                    <div class="area-header">
                        <span>${area}</span>
                        <span>${uffici.length} uffici</span>
                    </div>
                    <div class="office-list">
                        ${uffici.map(u => `
                            <div class="office-item">
                                <span>${u.ufficio}</span>
                                <span class="code">${u.codice}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
                
                block.querySelector('.area-header').addEventListener('click', () => {
                    block.classList.toggle('collapsed');
                });
                
                container.appendChild(block);
            });
        }

        function initSearch() {
            const searchInput = document.getElementById('searchInput');
            
            searchInput.addEventListener('input', () => {
                const searchTerm = searchInput.value.trim().toLowerCase();
                const filteredData = filterData(searchTerm);
                renderBlocks(filteredData);
            });
        }

        function filterData(term) {
            return Object.entries(allData).reduce((acc, [area, uffici]) => {
                const filtered = uffici.filter(u => 
                    u.ufficio.toLowerCase().includes(term) || 
                    u.codice.toLowerCase().includes(term)
                );
                
                if(filtered.length > 0) acc[area] = filtered;
                return acc;
            }, {});
        }

        function showError() {
            const container = document.getElementById('areasContainer');
            container.innerHTML = `
                <div class="no-results">
                    <h3>Errore nel caricamento dei dati</h3>
                    <p>Verificare:<br>
                    1. Connessione internet<br>
                    2. Disponibilità del documento<br>
                    3. Autorizzazioni di accesso</p>
                </div>
            `;
        }

        window.onload = loadData;
    </script>
</body>
</html>
